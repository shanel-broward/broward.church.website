<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upcoming Events Strip</title>
<style>
  /* ============================================================
     bc-events — Homepage Upcoming Events Strip
     Component 1 of 2 (events system). Self-contained: paste the
     full <body> contents into an Elementor "HTML" widget, or embed
     the whole file for standalone testing.
     ============================================================ */

  .bc-events {
    background-color: transparent;
    padding: 96px 24px;
    box-sizing: border-box;
  }

  .bc-events *,
  .bc-events *::before,
  .bc-events *::after {
    box-sizing: border-box;
  }

  .bc-events__container {
    max-width: 1240px;
    margin: 0 auto;
  }

  .bc-events__grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
  }

  .bc-events__card {
    background-color: #FBF8F4;
    border: 1px solid #EFEBE3;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .bc-events__image-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background-color: #EFEBE3;
  }

  .bc-events__image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .bc-events__body {
    padding: 24px 28px 28px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .bc-events__date {
    font-family: "Neue Haas Display Light", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: #386641;
    margin: 0 0 10px 0;
  }

  .bc-events__title {
    font-family: "Neue Haas Display Medium", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 22px;
    line-height: 1.25;
    color: #000000;
    margin: 0 0 12px 0;
  }

  .bc-events__description {
    font-family: "Neue Haas Display Light", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 16px;
    line-height: 1.5;
    color: #000000;
    opacity: 0.65;
    margin: 0 0 20px 0;
    flex: 1;
  }

  .bc-events__link {
    font-family: "Neue Haas Display Roman", "Neue Haas Display Regular", "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    font-size: 15px;
    color: #386641;
    text-decoration: none;
    border-bottom: 1px solid #386641;
    align-self: flex-start;
    padding-bottom: 2px;
    transition: opacity 0.15s ease;
  }

  .bc-events__link:hover,
  .bc-events__link:focus-visible {
    opacity: 0.7;
  }

  .bc-events__footer {
    text-align: center;
    margin-top: 56px;
  }

  .bc-events__view-all {
    font-family: "Neue Haas Display Roman", "Neue Haas Display Regular", "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    font-size: 15px;
    color: #386641;
    text-decoration: none;
    border-bottom: 1px solid #386641;
    padding-bottom: 2px;
    display: inline-block;
    transition: opacity 0.15s ease;
  }

  .bc-events__view-all:hover,
  .bc-events__view-all:focus-visible {
    opacity: 0.7;
  }

  .bc-events__empty {
    font-family: "Neue Haas Display Light", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    color: #000000;
    opacity: 0.65;
    grid-column: 1 / -1;
    text-align: center;
    padding: 32px 0;
  }

  @media (max-width: 900px) {
    .bc-events__grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 640px) {
    .bc-events {
      padding: 48px 20px;
    }

    .bc-events__grid {
      gap: 24px;
    }

    .bc-events__footer {
      margin-top: 40px;
    }
  }

  /* ---- Learn More modal: expanded version of the card ---- */

  .bc-events__modal-overlay {
    position: fixed;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 9999;
  }

  .bc-events__modal-overlay.is-open {
    display: flex;
  }

  .bc-events__modal {
    background-color: #FBF8F4;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    border: 1px solid #EFEBE3;
  }

  .bc-events__modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background-color: rgba(251, 248, 244, 0.9);
    color: #000000;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s ease;
    z-index: 1;
  }

  .bc-events__modal-close:hover,
  .bc-events__modal-close:focus-visible {
    opacity: 0.6;
  }

  .bc-events__modal-image-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background-color: #EFEBE3;
  }

  .bc-events__modal-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .bc-events__modal-body {
    padding: 32px;
  }

  .bc-events__modal-date {
    font-family: "Neue Haas Display Light", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: #386641;
    margin: 0 0 10px 0;
  }

  .bc-events__modal-title {
    font-family: "Neue Haas Display Medium", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    font-size: 28px;
    line-height: 1.2;
    color: #000000;
    margin: 0 0 12px 0;
  }

  .bc-events__modal-location {
    font-family: "Neue Haas Display Roman", "Neue Haas Display Regular", "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    font-size: 15px;
    color: #000000;
    opacity: 0.65;
    margin: 0 0 16px 0;
  }

  .bc-events__modal-description {
    font-family: "Neue Haas Display Light", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 16px;
    line-height: 1.6;
    color: #000000;
    opacity: 0.8;
    margin: 0 0 28px 0;
    white-space: pre-line;
  }

  .bc-events__modal-cta {
    font-family: "Neue Haas Display Roman", "Neue Haas Display Regular", "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    font-size: 15px;
    color: #386641;
    text-decoration: none;
    border-bottom: 1px solid #386641;
    padding-bottom: 2px;
    display: inline-block;
    transition: opacity 0.15s ease;
  }

  .bc-events__modal-cta:hover,
  .bc-events__modal-cta:focus-visible {
    opacity: 0.7;
  }

  body.bc-events-modal-open {
    overflow: hidden;
  }

  @media (max-width: 640px) {
    .bc-events__modal-body {
      padding: 24px;
    }

    .bc-events__modal-title {
      font-size: 24px;
    }
  }
</style>
</head>
<body>

<section class="bc-events">
  <div class="bc-events__container">
    <div class="bc-events__grid" id="bc-events-grid"></div>
  </div>
</section>

<div class="bc-events__modal-overlay" id="bc-events-modal-overlay" aria-hidden="true">
  <div class="bc-events__modal" id="bc-events-modal" role="dialog" aria-modal="true" aria-labelledby="bc-events-modal-title" tabindex="-1">
    <button type="button" class="bc-events__modal-close" id="bc-events-modal-close" aria-label="Close">&times;</button>
    <div class="bc-events__modal-image-wrap">
      <img class="bc-events__modal-image" id="bc-events-modal-image" src="" alt="">
    </div>
    <div class="bc-events__modal-body">
      <p class="bc-events__modal-date" id="bc-events-modal-date"></p>
      <h3 class="bc-events__modal-title" id="bc-events-modal-title"></h3>
      <p class="bc-events__modal-location" id="bc-events-modal-location"></p>
      <p class="bc-events__modal-description" id="bc-events-modal-description"></p>
      <a class="bc-events__modal-cta" id="bc-events-modal-cta" href="" target="_blank" rel="noopener"></a>
    </div>
  </div>
</div>

<script>
(function () {
  /* ============================================================
     EDIT EVENTS HERE. This is the only place anyone needs to
     touch to add, remove, or update events.

     Fields per event:
       title       - string
       date        - "YYYY-MM-DD" (the event's start date; used for sorting)
       time        - display string, e.g. "7:00 - 9:00 PM"
       description - short string shown on the card (one or two sentences).
                     Leave out or set to "" to show no description yet.
       image       - URL to a 16:9 (or croppable) photo
       link        - URL the "Learn More" modal's CTA button points to
       location    - optional, e.g. "Student Center" (omit or "" to hide)
       details     - optional longer text for the "Learn More" modal;
                     falls back to `description` if omitted
       ctaLabel    - optional button label in the modal, defaults to "Register"
       endDate     - optional "YYYY-MM-DD" for multi-day events; the card
                     stays visible until this date passes (defaults to `date`)
       dateLabel   - optional string that replaces the auto-generated
                     "WEEKDAY, MONTH DAY · TIME" label above the title —
                     use this for multi-day events, e.g. "NOVEMBER 6-8, 2026"

     Events whose date has already passed are automatically
     hidden. Of the remaining upcoming events, only the soonest
     3 are shown (sorted by date, ascending). Update the
     calendar link below to point at the church's real Calendar
     page when it exists.

     The "Learn More" link/modal is currently turned off below
     (BC_SHOW_LEARN_MORE = false) since there's no extra info or
     descriptions yet. Flip it to true once details are ready.
     ============================================================ */

  var BC_CALENDAR_URL = "https://example.org/calendar"; // TODO: the "View All Events" link is removed for now; re-add its markup and point this at the real Calendar page when it comes back
  var BC_SHOW_LEARN_MORE = false; // TODO: set to true once event details/descriptions are ready

  var BC_PLACEHOLDER_IMAGE = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="338" viewBox="0 0 600 338">' +
    '<rect width="600" height="338" fill="#EFEBE3"/>' +
    '<defs><pattern id="stripes" width="28" height="28" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">' +
    '<rect width="14" height="28" fill="#E4DFD4"/></pattern></defs>' +
    '<rect width="600" height="338" fill="url(#stripes)"/>' +
    '<text x="300" y="174" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" ' +
    'fill="#8A8578" text-anchor="middle" dominant-baseline="middle">EVENT PHOTO</text>' +
    '</svg>'
  );

  var BC_EVENTS = [
    {
      title: "Worship Concert",
      date: "2026-10-02",
      time: "7:00 PM",
      description: "",
      image: "https://raw.githubusercontent.com/shanel-broward/broward.church.website/claude/homepage-events-strip-2c7dmi/images/Worship%20Night.jpg",
      link: "https://example.org/events/worship-concert"
    },
    {
      title: "Men's Advance",
      date: "2026-11-06",
      endDate: "2026-11-08",
      dateLabel: "NOVEMBER 6-8, 2026 · LAKE PLACID, FL",
      description: "",
      image: "https://raw.githubusercontent.com/shanel-broward/broward.church.website/claude/homepage-events-strip-2c7dmi/images/Men's%20Advance.JPG",
      link: "https://example.org/events/mens-advance"
    },
    {
      title: "Fall Festival",
      date: "2026-11-22",
      time: "10:00 AM",
      description: "",
      image: "https://raw.githubusercontent.com/shanel-broward/broward.church.website/claude/homepage-events-strip-2c7dmi/images/Fall%20Festival.jpg",
      link: "https://example.org/events/fall-festival"
    }
  ];

  /* ============================================================
     DO NOT EDIT BELOW THIS LINE — rendering logic
     ============================================================ */

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function parseDateStr(str) {
    var parts = str.split("-");
    return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }

  function getStartDate(ev) {
    return parseDateStr(ev.date);
  }

  function getEndDate(ev) {
    return parseDateStr(ev.endDate || ev.date);
  }

  function formatDateLabel(ev) {
    if (ev.dateLabel) {
      return ev.dateLabel;
    }
    var formatted = getStartDate(ev).toLocaleDateString("en-US", {
      weekday: "long",
      month: "long",
      day: "numeric"
    });
    return formatted.toUpperCase() + (ev.time ? " · " + ev.time : "");
  }

  function getUpcomingEvents(events) {
    var today = new Date();
    today.setHours(0, 0, 0, 0);

    return events
      .filter(function (ev) {
        return getEndDate(ev) >= today;
      })
      .sort(function (a, b) {
        return getStartDate(a) - getStartDate(b);
      })
      .slice(0, 3);
  }

  var currentEvents = [];
  var lastFocusedElement = null;

  function renderEvents() {
    var grid = document.getElementById("bc-events-grid");
    currentEvents = getUpcomingEvents(BC_EVENTS);

    if (currentEvents.length === 0) {
      grid.innerHTML = '<p class="bc-events__empty">No upcoming events right now. Check back soon.</p>';
      return;
    }

    grid.innerHTML = currentEvents.map(function (ev, i) {
      var descriptionHtml = ev.description
        ? '<p class="bc-events__description">' + escapeHtml(ev.description) + '</p>'
        : "";
      var linkHtml = (BC_SHOW_LEARN_MORE && ev.link)
        ? '<a class="bc-events__link" href="' + escapeHtml(ev.link) + '" data-bc-event-index="' + i + '">Learn More</a>'
        : "";

      return (
        '<article class="bc-events__card">' +
          '<div class="bc-events__image-wrap">' +
            '<img class="bc-events__image" src="' + escapeHtml(ev.image) + '" alt="' + escapeHtml(ev.title) + '" loading="lazy">' +
          '</div>' +
          '<div class="bc-events__body">' +
            '<p class="bc-events__date">' + escapeHtml(formatDateLabel(ev)) + '</p>' +
            '<h3 class="bc-events__title">' + escapeHtml(ev.title) + '</h3>' +
            descriptionHtml +
            linkHtml +
          '</div>' +
        '</article>'
      );
    }).join("");
  }

  function openModal(ev) {
    var overlay = document.getElementById("bc-events-modal-overlay");
    var modal = document.getElementById("bc-events-modal");
    var locationEl = document.getElementById("bc-events-modal-location");
    var cta = document.getElementById("bc-events-modal-cta");

    document.getElementById("bc-events-modal-image").setAttribute("src", ev.image);
    document.getElementById("bc-events-modal-image").setAttribute("alt", ev.title);
    document.getElementById("bc-events-modal-date").textContent = formatDateLabel(ev);
    document.getElementById("bc-events-modal-title").textContent = ev.title;
    document.getElementById("bc-events-modal-description").textContent = ev.details || ev.description;

    if (ev.location) {
      locationEl.textContent = ev.location;
      locationEl.style.display = "";
    } else {
      locationEl.textContent = "";
      locationEl.style.display = "none";
    }

    cta.setAttribute("href", ev.link);
    cta.textContent = ev.ctaLabel || "Register";

    lastFocusedElement = document.activeElement;
    overlay.classList.add("is-open");
    overlay.setAttribute("aria-hidden", "false");
    document.body.classList.add("bc-events-modal-open");
    modal.focus();
    document.addEventListener("keydown", onModalKeydown);
  }

  function closeModal() {
    var overlay = document.getElementById("bc-events-modal-overlay");
    overlay.classList.remove("is-open");
    overlay.setAttribute("aria-hidden", "true");
    document.body.classList.remove("bc-events-modal-open");
    document.removeEventListener("keydown", onModalKeydown);
    if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
      lastFocusedElement.focus();
    }
  }

  function onModalKeydown(e) {
    if (e.key === "Escape") {
      closeModal();
    }
  }

  document.getElementById("bc-events-grid").addEventListener("click", function (e) {
    var link = e.target.closest(".bc-events__link");
    if (!link) {
      return;
    }
    e.preventDefault();
    var index = Number(link.getAttribute("data-bc-event-index"));
    openModal(currentEvents[index]);
  });

  document.getElementById("bc-events-modal-close").addEventListener("click", closeModal);

  document.getElementById("bc-events-modal-overlay").addEventListener("click", function (e) {
    if (e.target === e.currentTarget) {
      closeModal();
    }
  });

  renderEvents();
})();
</script>

</body>
</html>
